<g font-family="Arial,sans-serif" font-weight="800" font-size="82" letter-spacing="-3"><text x="50" y="176" fill="#f6f4e8">Sponsor the</text><text x="50" y="267" fill="#c2f977">boring bits.</text></g>
<text x="56" y="317" fill="#b7c9b8" font-family="Arial,sans-serif" font-size="23">The fixes. The docs. The build that still works.</text>
