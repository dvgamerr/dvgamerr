name: Update GitHub Stats

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gh-stats.yml"
      - "scripts/**"
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Test stats generator
        run: node --test scripts/github-stats/*.test.mjs

      - name: Generate stats card
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/generate-gh-stats.mjs

      - name: Commit updated stats
        run: |
          if git diff --quiet -- gh-stats.svg; then
            echo "GitHub stats are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gh-stats.svg
          git commit -m "Update GitHub stats SVG [skip ci]"
          git push
